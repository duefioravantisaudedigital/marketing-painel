services:
  marketing-painel:
    build:
      context: .
      args:
        VITE_API_URL: https://api-marketing.duefioravanti-saudedigital.com.br
    container_name: marketing-painel
    restart: unless-stopped
    networks: [web]
    mem_limit: 64m
    # Log no journald do sistema: sobrevive a cada deploy (o json-file some quando o container e recriado)
    logging:
      driver: journald
      options:
        tag: marketing-painel

networks:
  web:
    external: true

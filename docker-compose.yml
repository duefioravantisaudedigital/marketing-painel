services:
  marketing-painel:
    build:
      context: .
      args:
        VITE_API_URL: https://api-marketing.duefioravanti-saudedigital.com.br
    container_name: marketing-painel
    restart: unless-stopped
    networks: [web]
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  web:
    external: true
